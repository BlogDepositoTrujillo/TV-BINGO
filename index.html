<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla TV Bingo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
}

.numero{
font-size:250px;
font-weight:bold;
text-align:center;
}

.historial{
margin-top:50px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
width:90%;
}

.bola{
background:#ff9800;
padding:12px 18px;
border-radius:30px;
font-size:24px;
font-weight:bold;
}

</style>
</head>
<body>

<div id="numero" class="numero">
--
</div>

<div id="historial" class="historial">
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyBn5NKTqkMfKiArerG5LgytLa4h67hjfog",
authDomain: "bingo-d817b.firebaseapp.com",
databaseURL: "https://bingo-d817b-default-rtdb.firebaseio.com",
projectId: "bingo-d817b",
storageBucket: "bingo-d817b.firebasestorage.app",
messagingSenderId: "763915768353",
appId: "1:763915768353:web:311d4124789acd14614960"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(
ref(db, "bingo/ultimoNumero"),
(snapshot) => {

document.getElementById("numero").innerHTML =
snapshot.val() || "--";

}
);

onValue(
ref(db, "bingo/historial"),
(snapshot) => {

let html = "";

if(snapshot.exists()){

const datos = snapshot.val();

Object.values(datos)
.reverse()
.forEach(item => {

html += `
<div class="bola">
${item.numero}
</div>
`;

});

}

document.getElementById("historial").innerHTML = html;

}
);

</script>

</body>
</html>
