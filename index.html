<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla TV Bingo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
}

.numero{
font-size:250px;
font-weight:bold;
}

.historial{
margin-top:50px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
width:90%;
}

.bola{
background:#ff9800;
padding:12px 18px;
border-radius:30px;
font-size:24px;
font-weight:bold;
}

</style>
</head>
<body>

<div id="numero" class="numero">
--
</div>

<div
id="historial"
class="historial">
</div>

<script>

function actualizar(){

let ultimo =
localStorage.getItem(
"ultimoNumero"
);

document.getElementById(
"numero"
).innerHTML =
ultimo || "--";

let historial =
JSON.parse(
localStorage.getItem(
"historial"
) || "[]"
);

let html="";

historial.forEach(item=>{

html += `
<div class="bola">
${item}
</div>
`;

});

document.getElementById(
"historial"
).innerHTML = html;

}

actualizar();

window.addEventListener(
"storage",
actualizar
);

setInterval(
actualizar,
500
);

</script>

</body>
</html>
